{% load static site_copy sales_format %}

<script src="{% static 'js/order-installment-picker.js' %}?v={{ app_version }}"></script>
<script src="{% static 'js/order-commission-recipient.js' %}?v={{ app_version }}" defer></script>
{{ vehicle_rate_data|json_script:"vehicle-rate-data" }}
{{ accessory_product_data|json_script:"accessory-product-data" }}
<script>
(() => {
  const byId = id => document.getElementById(id);
  const sourceType = byId("id_source_type");
  const ownerType = byId("id_owner_type");
  const paymentType = byId("id_payment_type");
  const isTradeInSubsidy = byId("id_is_trade_in_subsidy");
  const tradeInIntent = byId("id_trade_in_intent");
  const installmentInputs = [
    byId("id_installment_company"),
    byId("id_installment_periods"),
    byId("id_installment_opening_fee"),
    byId("id_installment_monthly"),
  ].filter(Boolean);
  const installmentPlanEndpoint = "{% url installment_options_route|default:'installment_plan_options' %}";
  const vehiclePriceEndpoint = "{% url price_options_route|default:'vehicle_price_options' %}";
  const installmentPlanHint = byId("installment-plan-hint");
  const plateChoice = byId("id_plate_choice");
  const deliveryMethod = byId("id_delivery_method");
  const vehicleModel = byId("id_vehicle_model");
  const vehiclePrice = byId("id_vehicle_price");
  const vehiclePriceAdjustment = byId("vehicle-price-adjustment");
  const vehiclePriceGuidanceTitle = byId("vehicle-price-guidance-title");
  const vehiclePriceGuidanceDetail = byId("vehicle-price-guidance-detail");
  const vehicleEnergyType = byId("id_vehicle_energy_type");
  const color = byId("id_color");
  const vehicleRateData = JSON.parse(byId("vehicle-rate-data").textContent);
  const accessoryProductData = JSON.parse(byId("accessory-product-data").textContent);
  const registrationDate = byId("id_registration_date");
  const insurancePeriod = byId("id_compulsory_insurance_period");
  const plateSelectionFee = byId("id_plate_selection_fee");
  const lienRegistrationFee = byId("id_lien_registration_fee");
  const calculatedRegistrationTotal = byId("id_registration_calculated_total");
  const actualPlateInsuranceFee = byId("id_plate_insurance_fee");
  const gasCalculator = byId("gas-registration-calculator");
  const nonGasMessage = byId("non-gas-registration-message");
  const rateSummary = byId("registration-rate-summary");
  const idFront = byId("id_id_front");
  const idBack = byId("id_id_back");
  const ocrStatus = byId("ocr-status");
  const ocrStatusTitle = byId("ocr-status-title");
  const ocrMessage = byId("ocr-message");
  const ocrButton = byId("run-id-ocr");
  const ocrConfirmationFields = [
    ...document.querySelectorAll("[data-ocr-confirmation-fields]")
  ];
  const orderForm = byId("order-form");
  const draftId = byId("draft-id");
  const editingOrderId = byId("editing-order-id").value;
  const completedRegistrationInputs = [vehicleModel, registrationDate, insurancePeriod, plateSelectionFee, lienRegistrationFee];
  const completedRegistrationBasis = orderForm.dataset.completedCorrection
    ? JSON.stringify(completedRegistrationInputs.map(input => input.value)) : null;
  const completedFeeFields = ["id_registration_plate_fee", "id_registration_license_fee", "id_registration_inspection_fee",
    "id_road_maintenance_fee", "id_license_tax_fee", "id_compulsory_insurance_fee", "id_registration_calculated_total"];
  const completedFeeValues = completedFeeFields.map(id => byId(id).value);
  const completedActualPlateFee = actualPlateInsuranceFee.value;
  const draftRevision = byId("draft-revision");
  const draftStatus = byId("draft-status");
  const draftStatusMessage = byId("draft-status-message");
  const draftDeleteForm = byId("draft-delete-form");
  const draftDeleteButton = byId("draft-delete-button");
  const editingPresence = byId("editing-presence");
  const validationSummary = byId("form-validation-summary");
  const collaborationStatus = byId("collaboration-status");
  const fieldVersionsInput = byId("field-versions");
  const conflictPanel = byId("field-conflict");
  const conflictMessage = byId("field-conflict-message");
  const progressLinks = [...document.querySelectorAll("#form-progress a")];
  const progressSections = progressLinks.map(link => byId(link.hash.slice(1)));
  let ocrRunning = false;
  let ocrRequestVersion = 0;
  let currentOcrJobId = null;
  let ocrPollTimer = null;
  let pendingOcrResult = null;
  let draftTimer = null;
  let draftSaving = false;
  let draftQueued = false;
  let currentPriceRecommendation = null;
  let vehiclePriceRequestController = null;
  let submittingOrder = false;
  let editFormDirty = false;
  let collaborationSocket = null;
  let collaborationReconnectTimer = null;
  let collaborationReconnectDelay = 1000;
  let collaborationPingTimer = null;
  let collaborationConflict = null;
  let applyingRemoteValue = false;
  let lastRegistrationAutoValue = Number(calculatedRegistrationTotal.value || 0);
  const photoDirty = {id_front: false, id_back: false};
  const photoVersion = {id_front: 0, id_back: 0};
  const collaborativeFields = new Map();
  const collaborativeTimers = new Map();
  const remotePresences = new Map();
  const collaborationClientId = (
    sessionStorage.getItem("order-collaboration-client-id")
    || `${crypto.randomUUID?.() || Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`
  );
  sessionStorage.setItem("order-collaboration-client-id", collaborationClientId);
  let currentActiveSection = "source";

  function hasSelectedPhoto(input) {
    const clearButton = document.querySelector(`[data-clear-file="${input.id}"]`);
    return Boolean(input.files.length || clearButton?.dataset.existingPhoto === "1");
  }

  function hasIdentityValues() {
    return [
      byId("id_owner_name"),
      byId("id_owner_id_number"),
      byId("id_owner_birth_date"),
      byId("id_owner_address"),
    ].some(input => input?.value.trim());
  }

  function setOcrState(state, options = {}) {
    const supportsOcr = ["local", "foreign"].includes(ownerType.value);
    const revealFields = !supportsOcr || ["review", "manual", "existing"].includes(state);
    ocrConfirmationFields.forEach(element => { element.hidden = !revealFields; });
    if (!supportsOcr) {
      ocrStatus.hidden = true;
      return;
    }

    const states = {
      upload: {
        className: "ocr-status waiting",
        title: ownerType.value === "foreign" ? "請上傳居留證正反面" : "請上傳身分證正反面",
        message: "資料欄位會在辨識完成後自動顯示，避免重複輸入。",
        button: "",
      },
      incomplete: {
        className: "ocr-status waiting",
        title: "還差一張證件照片",
        message: "正反面備齊後會自動開始辨識。",
        button: "",
      },
      processing: {
        className: "ocr-status loading",
        title: "正在辨識證件資料",
        message: "完成後會通知您回來核對，可繼續填寫其他區塊。",
        button: "",
      },
      review: {
        className: options.warning ? "ocr-status warning" : "ocr-status success",
        title: "辨識完成，請核對資料",
        message: options.message || "請逐項對照證件照片，確認姓名、證號、生日與戶籍地址。",
        button: "重新辨識",
      },
      manual: {
        className: "ocr-status error",
        title: "無法完成自動辨識",
        message: options.message || "您可以重新拍攝，或直接人工填寫下方欄位。",
        button: "重新辨識",
      },
      existing: {
        className: "ocr-status success",
        title: "證件資料已載入",
        message: "請對照已保存的證件照片核對內容。",
        button: "",
      },
    };
    const config = states[state];
    ocrStatus.hidden = false;
    ocrStatus.className = config.className;
    ocrStatus.classList.toggle("is-floating-processing", state === "processing");
    ocrStatus.dataset.state = state;
    ocrStatusTitle.textContent = config.title;
    ocrMessage.textContent = config.message;
    ocrButton.hidden = !config.button;
    if (config.button) ocrButton.textContent = config.button;
  }

  function refreshOcrEntryState() {
    if (!["local", "foreign"].includes(ownerType.value) || ocrRunning || pendingOcrResult) return;
    if (hasIdentityValues()) {
      setOcrState("existing");
      return;
    }
    const photoCount = Number(hasSelectedPhoto(idFront)) + Number(hasSelectedPhoto(idBack));
    setOcrState(photoCount === 0 ? "upload" : "incomplete");
  }

  function setActiveSection(sectionId) {
    if (sectionId === currentActiveSection && document.querySelector("#form-progress a.active")) return;
    currentActiveSection = sectionId;
    progressLinks.forEach(link => {
      const active = link.hash === `#${sectionId}`;
      link.classList.toggle("active", active);
      if (active) {
        link.setAttribute("aria-current", "step");
        link.scrollIntoView({behavior: "smooth", block: "nearest", inline: "center"});
      } else {
        link.removeAttribute("aria-current");
      }
    });
  }

  let progressFrame = null;
  function updateActiveSection() {
    if (orderForm.hasAttribute('data-workspace-save')) return;
    progressFrame = null;
    const marker = Math.min(window.innerHeight * 0.32, 230);
    let activeSection = progressSections[0];
    for (const section of progressSections) {
      if (section.getBoundingClientRect().top <= marker) activeSection = section;
    }
    setActiveSection(activeSection.id);
  }

  window.addEventListener("scroll", () => {
    if (!progressFrame) progressFrame = requestAnimationFrame(updateActiveSection);
  }, {passive: true});
  progressLinks.forEach(link => {
    link.addEventListener("click", () => setActiveSection(link.hash.slice(1)));
  });
  updateActiveSection();

  function showConditional(name, show) {
    document.querySelectorAll(`[data-conditional="${name}"]`).forEach(el => el.hidden = !show);
  }

  function numericValue(input) {
    return Number(input?.value || 0);
  }

  const installmentPicker = DmisInstallmentPicker.create({
    endpoint: installmentPlanEndpoint, vehicleModel, paymentType,
    orderId: editingOrderId, hint: installmentPlanHint,
  });
  const loadInstallmentPlanOptions = options => installmentPicker.load(options);

  function formatMoney(value) {
    return `$${Number(value).toLocaleString("zh-TW", {maximumFractionDigits: 0})}`;
  }

  function updateVehiclePriceAdjustmentState() {
    if (!vehiclePriceAdjustment) return;
    const entered = vehiclePrice.value === "" ? null : Number(vehiclePrice.value);
    const differs = currentPriceRecommendation !== null
      && entered !== null
      && entered !== Number(currentPriceRecommendation.price);
    vehiclePriceAdjustment.hidden = !differs;
    if (differs) {
      const difference = Math.abs(entered - Number(currentPriceRecommendation.price));
      vehiclePriceGuidanceDetail.textContent = `目前輸入 ${formatMoney(entered)}，與系統建議相差 ${formatMoney(difference)}；請留下調整原因。`;
    } else if (currentPriceRecommendation) {
      vehiclePriceGuidanceDetail.textContent = vehiclePrice.disabled ? "已套用車型售價；如需調整成交條件，請在備註說明，由店內人員核對。" : "已套用售價版本；如人工修改成交價，系統會要求記錄原因。";
    }
  }

  async function loadVehiclePrice({force = false} = {}) {
    vehiclePriceRequestController?.abort();
    currentPriceRecommendation = null;
    if (!vehicleModel.value) {
      vehiclePriceGuidanceTitle.textContent = "請先選擇車型";
      vehiclePriceGuidanceDetail.textContent = "選擇後會依付款方式帶入訂單日適用售價。";
      updateVehiclePriceAdjustmentState();
      return;
    }
    vehiclePriceGuidanceTitle.textContent = "正在確認適用售價…";
    vehiclePriceGuidanceDetail.textContent = "系統會依訂單日與付款方式選擇最新有效版本。";
    vehiclePriceRequestController = new AbortController();
    try {
      const params = new URLSearchParams({
        vehicle_model: vehicleModel.value,
        payment_type: paymentType.value,
      });
      if (editingOrderId) params.set("order_id", editingOrderId);
      const response = await fetch(`${vehiclePriceEndpoint}?${params}`, {
        signal: vehiclePriceRequestController.signal,
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "無法讀取售價版本");
      if (!data.version || data.recommended_price === null) {
        vehiclePriceGuidanceTitle.textContent = "此車型目前沒有可帶入的售價";
        vehiclePriceGuidanceDetail.textContent = "請先至車型資料建立售價版本，或由人員直接輸入成交車價。";
        updateVehiclePriceAdjustmentState();
        return;
      }
      currentPriceRecommendation = {
        price: Number(data.recommended_price),
        label: data.recommended_label,
        version: data.version,
      };
      if (force || vehiclePrice.value === "") {
        vehiclePrice.value = data.recommended_price;
        vehiclePrice.dispatchEvent(new Event("input", {bubbles: true}));
      }
      const registrationText = data.recommended_label === "建議售價"
        ? (data.version.suggested_price_includes_registration ? "，含牌險" : "，不含牌險")
        : "";
      const versionSource = data.version.is_snapshot
        ? `${data.version.effective_from} 訂單原始版本`
        : `${data.version.effective_from} 版本`;
      vehiclePriceGuidanceTitle.textContent = `已依 ${versionSource}帶入${data.recommended_label} ${formatMoney(data.recommended_price)}${registrationText}`;
      updateVehiclePriceAdjustmentState();
    } catch (error) {
      if (error.name === "AbortError") return;
      vehiclePriceGuidanceTitle.textContent = "暫時無法讀取售價版本";
      vehiclePriceGuidanceDetail.textContent = `${error.message}；可先輸入車價，儲存前請再次確認。`;
    }
  }

  function roundHalfUp(value) {
    return Math.floor(value + 0.5);
  }

  function registrationRate(cc) {
    if (cc >= 51 && cc <= 125) return {code: "M2", label: "51～125 c.c.", road: 450};
    if (cc >= 126 && cc <= 250) return {code: "M3", label: "126～250 c.c.", road: 600};
    if (cc >= 251 && cc <= 500) return {code: "M4", label: "251～500 c.c.", road: 900};
    if (cc >= 501 && cc <= 600) return {code: "M5", label: "501～600 c.c.", road: 1200};
    return null;
  }

  function setCalculatedField(id, value) {
    const input = byId(id);
    if (input) input.value = value;
  }

  function filterVehicleModels() {
    const energyType = vehicleEnergyType.value;
    [...vehicleModel.options].forEach(option => {
      if (!option.value) return;
      const matches = vehicleRateData[option.value]?.energy_type === energyType;
      option.hidden = !matches;
      option.disabled = !matches;
    });
    if (
      vehicleModel.value
      && vehicleRateData[vehicleModel.value]?.energy_type !== energyType
    ) {
      vehicleModel.value = "";
      color.innerHTML = '<option value="">請先選擇車型</option>';
    }
  }

  function calculateRegistrationFee() {
    const manual = byId("id_registration_manual")?.checked;
    const manualFields = ["registration_plate_fee", "registration_license_fee", "registration_inspection_fee", "road_maintenance_fee", "license_tax_fee", "compulsory_insurance_fee"];
    manualFields.forEach(name => { if (byId(`id_${name}`)) byId(`id_${name}`).readOnly = !manual; });
    if (manual) {
      actualPlateInsuranceFee.value = [...manualFields, "plate_selection_fee", "lien_registration_fee"].reduce((sum, name) => sum + (Number(byId(`id_${name}`)?.value) || 0), 0);
      rateSummary.textContent = "自行調整：實際牌險為明細合計，儲存時需填寫原因";
      return;
    }
    if (completedRegistrationBasis !== null && completedRegistrationBasis === JSON.stringify(completedRegistrationInputs.map(input => input.value))) {
      const followedCalculation = actualPlateInsuranceFee.value === calculatedRegistrationTotal.value;
      completedFeeFields.forEach((id, index) => { byId(id).value = completedFeeValues[index]; });
      if (followedCalculation) actualPlateInsuranceFee.value = completedActualPlateFee;
      rateSummary.textContent = "完成後修正：保留原訂單牌險，變更計費條件才重新試算";
      return;
    }
    const modelData = vehicleRateData[vehicleModel.value];
    const energyType = vehicleEnergyType.value;
    const isGas = energyType === "gas";
    const isElectric = ["electric", "light_electric"].includes(energyType);
    const isSupported = isGas || isElectric;
    gasCalculator.hidden = !isSupported;
    nonGasMessage.hidden = isSupported;

    if (isElectric) {
      rateSummary.textContent = modelData?.electric_registration_class
        ? "電動車牌險將依品牌、領牌級別及領牌日期套用；儲存後顯示正式試算"
        : "此電動車尚未設定輕型／重型領牌級別，請先至車型資料補齊";
      return;
    }
    if (!isGas) {
      rateSummary.textContent = energyType
        ? "此動力類型目前由人員輸入實際牌險合計"
        : "選擇動力類型與車型後自動試算";
      return;
    }
    const cc = Number(modelData?.displacement_cc || 0);
    const rate = registrationRate(cc);
    const selectedDate = registrationDate.value
      ? new Date(`${registrationDate.value}T00:00:00`)
      : null;
    if (!modelData || !rate || !selectedDate) {
      rateSummary.textContent = modelData && !cc
        ? "此油車尚未設定排氣量，請先至資料維護區的車型資料設定"
        : editingOrderId
          ? "請選擇已設定排氣量的油車與預計領牌日期"
          : "領牌日期於後續編輯時填寫，牌險依單據收款";
      return;
    }

    const month = selectedDate.getMonth() + 1;
    const day = Math.min(selectedDate.getDate(), 30);
    const standardDays = (12 - month) * 30 + (30 - day) + 1;
    const year = selectedDate.getFullYear();
    const endOfYear = new Date(`${year}-12-31T00:00:00`);
    const calendarDays = Math.round((endOfYear - selectedDate) / 86400000) + 1;
    const daysInYear = (
      new Date(`${year}-12-31T00:00:00`)
      - new Date(`${year}-01-01T00:00:00`)
    ) / 86400000 + 1;
    const annualTax = cc <= 150 ? 0 : cc <= 250 ? 800 : cc <= 500 ? 1620 : 2160;
    const roadFee = Math.floor(rate.road * standardDays / 360);
    const taxFee = roundHalfUp(annualTax * calendarDays / daysInYear);
    const period = Number(insurancePeriod.value || 1);
    const insuranceFee = cc <= 250
      ? (period === 2 ? 1200 : 658)
      : (period === 2 ? 1306 : 711);

    setCalculatedField("id_registration_plate_fee", cc >= 550 ? 400 : 300);
    setCalculatedField("id_registration_license_fee", 150);
    setCalculatedField("id_registration_inspection_fee", 200);
    setCalculatedField("id_road_maintenance_fee", roadFee);
    setCalculatedField("id_license_tax_fee", taxFee);
    setCalculatedField("id_compulsory_insurance_fee", insuranceFee);
    const total = (cc >= 550 ? 400 : 300)
      + 150 + 200 + roadFee + taxFee + insuranceFee
      + numericValue(plateSelectionFee) + numericValue(lienRegistrationFee);
    calculatedRegistrationTotal.value = total;
    if (
      actualPlateInsuranceFee.value === ""
      || numericValue(actualPlateInsuranceFee) === lastRegistrationAutoValue
    ) {
      actualPlateInsuranceFee.value = total;
    }
    lastRegistrationAutoValue = total;
    rateSummary.textContent = `${rate.label}｜實際排氣量 ${cc} c.c.｜養管費計費 ${standardDays} 天｜牌照稅計費 ${calendarDays} 天`;
  }

  function refresh() {
    showConditional("source", true);
    showConditional("identity-upload", ["local", "foreign"].includes(ownerType.value));
    showConditional("corporate", ownerType.value === "corporate");
    document.querySelector(".owner-form-grid")?.classList.toggle(
      "is-nonlocal", ownerType.value === "corporate"
    );
    showConditional("foreign", ownerType.value === "foreign");
    const addressField = byId("id_owner_address")?.closest(".field");
    const addressTarget = document.querySelector(
      ownerType.value === "foreign"
        ? "[data-front-identity-fields]"
        : "[data-back-identity-fields]"
    );
    if (addressField && addressTarget && addressField.parentElement !== addressTarget) {
      addressTarget.appendChild(addressField);
    }
    showConditional("installment", paymentType.value === "installment");
    const installmentRequired = paymentType.value === "installment";
    installmentInputs.forEach(input => { input.required = installmentRequired; });
    installmentPicker.syncRequired();
    showConditional("trade-in-owner", tradeInIntent ? tradeInIntent.value === 'yes' : isTradeInSubsidy.checked);
    showConditional("watch", plateChoice.value === "watch");
    showConditional("preference", plateChoice.value === "preference");
    const needsDestination = ["direct_delivery", "carrier"].includes(deliveryMethod.value);
    showConditional("delivery-destination", needsDestination);
    byId("id_delivery_destination").required = needsDestination;
    refreshOcrEntryState();
  }
  let previousPaymentType = paymentType.value;
  paymentType.addEventListener("change", () => {
    if (
      previousPaymentType === "installment"
      && paymentType.value !== "installment"
      && installmentInputs.some(input => input.value && Number(input.value) !== 0)
    ) {
      const confirmed = window.confirm(
        "切換為非分期付款後，將清除分期公司、期數、開辦費與每期金額。是否繼續？"
      );
      if (!confirmed) {
        paymentType.value = previousPaymentType;
        refresh();
        return;
      }
    }
    if (paymentType.value !== "installment") {
      installmentInputs.forEach(input => { input.value = ""; });
    }
    previousPaymentType = paymentType.value;
    refresh();
    loadVehiclePrice({force: true});
    if (paymentType.value === "installment") loadInstallmentPlanOptions();
  });
  [sourceType, ownerType, plateChoice, deliveryMethod, isTradeInSubsidy, tradeInIntent].filter(Boolean)
    .forEach(el => el.addEventListener("change", refresh));
  if (!vehicleEnergyType.value && vehicleModel.value) {
    vehicleEnergyType.value = vehicleRateData[vehicleModel.value]?.energy_type || "";
  }
  vehicleEnergyType.addEventListener("change", () => {
    filterVehicleModels();
    calculateRegistrationFee();
    loadVehiclePrice({force: true});
  });
  [vehicleModel, registrationDate, insurancePeriod, plateSelectionFee, lienRegistrationFee]
    .forEach(el => el.addEventListener("change", calculateRegistrationFee));
  [plateSelectionFee, lienRegistrationFee]
    .forEach(el => el.addEventListener("input", calculateRegistrationFee));
  ["registration_manual", "registration_plate_fee", "registration_license_fee", "registration_inspection_fee", "road_maintenance_fee", "license_tax_fee", "compulsory_insurance_fee"]
    .forEach(name => byId(`id_${name}`)?.addEventListener("input", calculateRegistrationFee));
  filterVehicleModels();
  calculateRegistrationFee();
  refresh();

  let sourceRequestController = null;
  let colorRequestController = null;
  sourceType.addEventListener("change", async () => {
    const source = byId("id_source");
    sourceRequestController?.abort();
    const requestedType = sourceType.value;
    source.innerHTML = '<option value="">來源載入中…</option>';
    source.disabled = true;
    sourceRequestController = new AbortController();
    try {
      const response = await fetch(`{% url 'sales_sources' %}?type=${requestedType}`, {signal: sourceRequestController.signal});
      if (!response.ok) throw new Error("來源載入失敗");
      const data = await response.json();
      if (sourceType.value !== requestedType) return;
      source.innerHTML = requestedType === "store"
        ? '<option value="">未指定本店承辦人員</option>'
        : '<option value="">請選擇來源名稱</option>';
      data.results.forEach(item => source.add(new Option(item.name, item.id)));
      source.disabled = false;
    } catch (error) {
      if (error.name === "AbortError") return;
      source.innerHTML = '<option value="">載入失敗，請重新選擇來源類型</option>';
      source.disabled = false;
    }
  });

  async function loadVehicleColors({preserveCurrent = false} = {}) {
    colorRequestController?.abort();
    const requestedModel = vehicleModel.value;
    const previousColor = preserveCurrent ? color.value : "";
    if (!requestedModel) {
      color.innerHTML = '<option value="">請先選擇車型</option>';
      color.disabled = true;
      return;
    }
    color.innerHTML = '<option value="">車色載入中…</option>';
    color.disabled = true;
    colorRequestController = new AbortController();
    try {
      const response = await fetch(`{% url 'vehicle_colors' %}?model=${requestedModel}`, {signal: colorRequestController.signal});
      if (!response.ok) throw new Error("車色載入失敗");
      const data = await response.json();
      if (vehicleModel.value !== requestedModel) return;
      color.innerHTML = '<option value="">請選擇車色</option>';
      data.results.forEach(item => color.add(new Option(item.name, item.id)));
      if (previousColor && data.results.some(item => String(item.id) === String(previousColor))) {
        color.value = previousColor;
      }
      color.disabled = data.results.length === 0;
      if (!data.results.length) {
        color.innerHTML = '<option value="">此車型尚未設定可用車色</option>';
      }
    } catch (error) {
      if (error.name === "AbortError") return;
      color.innerHTML = '<option value="">載入失敗，請重新選擇車型</option>';
      color.disabled = true;
    }
  }

  async function runIdOcr() {
    if (ocrRunning || !["local", "foreign"].includes(ownerType.value)) return;
    if (!idFront.files.length || !idBack.files.length) return;
    const requestVersion = ++ocrRequestVersion;
    const photoToken = `${Date.now()}-${photoVersion.id_front}-${photoVersion.id_back}`;
    ocrRunning = true;
    setOcrState("processing");
    const payload = new FormData();
    payload.append("front", idFront.files[0]);
    payload.append("back", idBack.files[0]);
    payload.append(
      "document_type",
      ownerType.value === "foreign" ? "resident_certificate" : "national_id"
    );
    payload.append("photo_token", photoToken);
    try {
      const response = await fetch("{% url 'id_card_ocr' %}", {
        method: "POST",
        headers: {"X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value},
        body: payload,
      });
      const data = await response.json();
      if (requestVersion !== ocrRequestVersion) return;
      if (!response.ok || !data.ok) throw new Error(data.error || "無法排入辨識工作");
      currentOcrJobId = data.job_id;
      pollIdOcr(data.job_id, photoToken, requestVersion);
    } catch (error) {
      if (requestVersion !== ocrRequestVersion) return;
      ocrRunning = false;
      setOcrState("manual", {
        message: `${error.message} 可重新拍攝，或直接人工填寫下方欄位。`,
      });
    }
  }

  async function pollIdOcr(jobId, photoToken, requestVersion) {
    if (requestVersion !== ocrRequestVersion || jobId !== currentOcrJobId) return;
    try {
      const response = await fetch(`/api/id-card-ocr/${jobId}/`, {
        headers: {"X-Requested-With": "XMLHttpRequest"},
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "無法取得辨識進度");
      if (data.photo_token !== photoToken) return;
      if (["queued", "running"].includes(data.status)) {
        ocrPollTimer = window.setTimeout(
          () => pollIdOcr(jobId, photoToken, requestVersion),
          2000
        );
        return;
      }
      ocrRunning = false;
      if (data.status === "succeeded") {
        pendingOcrResult = data;
        applyOcrResult();
        showOcrCompletedNotice();
      } else if (data.status === "failed") {
        setOcrState("manual", {
          message: `${data.error || "辨識失敗"} 可重新拍攝，或直接人工填寫下方欄位。`,
        });
      }
    } catch (error) {
      ocrRunning = false;
      setOcrState("manual", {
        message: `${error.message} 請稍後重新辨識，或直接人工填寫下方欄位。`,
      });
    }
  }

  function applyOcrResult() {
    if (!pendingOcrResult) return;
    const fields = pendingOcrResult.fields || {};
    let retainedExistingValue = false;
    const mapping = {
      name: "id_owner_name",
      birth_date: "id_owner_birth_date",
      id_number: "id_owner_id_number",
      address: "id_owner_address",
    };
    Object.entries(mapping).forEach(([source, target]) => {
      if (!fields[source]) return;
      const input = byId(target);
      if (!input.value) {
        input.value = fields[source];
      } else if (input.value !== fields[source]) {
        retainedExistingValue = true;
      }
    });
    byId("id_id_verified").checked = false;
    const warnings = pendingOcrResult.warnings || [];
    setOcrState("review", {
      warning: Boolean(warnings.length || retainedExistingValue),
      message: retainedExistingValue
        ? "已保留原有資料，未自動覆蓋；請對照新照片逐項核對。"
        : warnings.length
        ? `已帶入辨識結果；${warnings.join(" ")} 請特別核對。`
        : "已自動帶入資料，請逐項對照照片後勾選「已人工核對證件」。",
    });
    pendingOcrResult = null;
    scheduleDraft();
  }

  function showOcrCompletedNotice() {
    const notice = document.createElement("div");
    notice.className = "ocr-completed-notice";
    notice.innerHTML = "<strong>證件辨識完成</strong><span>資料已帶入，請前往核對</span>";
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "前往核對";
    button.addEventListener("click", () => {
      notice.remove();
      byId("owner").open = true;
      byId("owner").scrollIntoView({behavior: "smooth", block: "start"});
    });
    notice.append(button);
    document.body.append(notice);
    window.setTimeout(() => notice.remove(), 12000);
  }

  async function invalidateCurrentOcr() {
    window.clearTimeout(ocrPollTimer);
    if (!currentOcrJobId) return;
    const jobId = currentOcrJobId;
    currentOcrJobId = null;
    try {
      await fetch(`/api/id-card-ocr/${jobId}/invalidate/`, {
        method: "POST",
        headers: {"X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value},
      });
    } catch (_) {}
  }

  function refreshPhotoButtons() {
    document.querySelectorAll("[data-clear-file]").forEach(button => {

        !byId(button.dataset.clearFile).files.length
        && button.dataset.existingPhoto !== "1"
      );
    });

  function photoChanged(event) {
    photoVersion[event.target.name] += 1;
    photoDirty[event.target.name] = true;
    byId(`remove-${event.target.name.replaceAll("_", "-")}`).value = "0";
    event.target.closest(".capture-card")?.classList.remove("has-saved-photo");
    document.querySelector(`[data-saved-photo="${event.target.name}"]`)?.remove();
    const preview = document.querySelector(
      `[data-photo-preview="${event.target.name}"]`
    );
    if (preview && event.target.files[0]) {
      preview.src = URL.createObjectURL(event.target.files[0]);
      preview.hidden = false;
    }
    invalidateCurrentOcr();
    ocrRequestVersion += 1;
    ocrRunning = false;
    pendingOcrResult = null;
    refreshPhotoButtons();
    byId("id_id_verified").checked = false;
    refreshOcrEntryState();
    runIdOcr();
  }

  function refreshAccessoryRequired(row, changed = false) {
    if (row.classList.contains("is-pending-delete")) return;
    const productInput = row.querySelector('[name$="-accessory_product"]');
    const customInput = row.querySelector('[name$="-custom_name"]');
    if (customInput && customInput.type !== 'hidden') {
      const customField = customInput.closest('[data-custom-accessory]');
      const other = productInput?.value === 'other' || (!productInput?.value && Boolean(customInput.value.trim()));
      if (customField) customField.hidden = !other;
      customInput.required = other;
      if (changed && !other) customInput.value = '';
    }
    const hasProduct = Boolean(productInput?.value || row.querySelector('[name$="-custom_name"]')?.value.trim());
    row.classList.toggle("has-accessory-name", hasProduct);
    row.querySelectorAll('[name$="-quantity"], [name$="-line_type"]')
      .forEach(input => input.required = hasProduct);
    const product = accessoryProductData[productInput?.value];
    if (row.querySelector('[name$="-line_type"]').value === 'gift') {
      row.querySelector('[name$="-amount"]').value = 0;
      row.querySelector('[name$="-labor_fee"]').value = 0;
    }
    if (product) {
      const salePrice = row.querySelector('[name$="-amount"]');
      const laborFee = row.querySelector('[name$="-labor_fee"]');
      const gift = row.querySelector('[name$="-line_type"]').value === 'gift';
      if (salePrice && (changed || gift || salePrice.value === "")) salePrice.value = gift ? 0 : product.sale_price;
      if (laborFee && (changed || gift || laborFee.value === "")) laborFee.value = gift ? 0 : product.labor_fee;
    }
    const total = Number(row.querySelector('[name$="-amount"]').value || 0) + Number(row.querySelector('[name$="-labor_fee"]').value || 0);
    row.querySelector('[data-accessory-total]').textContent = total.toLocaleString('zh-TW');
    const quantity = Number(row.querySelector('[name$="-quantity"]').value || 0);
    row.querySelector('[data-accessory-quantity-total]').textContent = `數量 ${quantity}，本列合計 $${(total * quantity).toLocaleString('zh-TW')}`;
  }

  function bindAccessoryRow(row) {

  function bindRemoveRow(row) {

  function isCollaborativeField(input) {
    if (!input?.name || input.disabled) return false;
    if (input.type === "file" || input.type === "submit" || input.type === "button") return false;
    return ![
      "csrfmiddlewaretoken",
      "_draft_id",
      "_draft_revision",
      "_remove_id_front",
      "_remove_id_back",
      "_field_versions",
    ].includes(input.name);
  }

  function readCollaborativeValue(input) {
    if (input.type === "checkbox") return input.checked ? (input.value || "on") : "";
    return input.value;
  }

  function collaborativeKind(input) {
    if (input.tagName === "TEXTAREA") return "textarea";
    if (input.tagName === "SELECT" || input.type === "checkbox") return "choice";
    if (["text", "email", "tel", "search"].includes(input.type)) return "text";
    return "scalar";
  }

  function updateFieldVersionsInput() {
    const versions = {};
    collaborativeFields.forEach((state, fieldName) => {
      versions[fieldName] = state.version;
    });
    fieldVersionsInput.value = JSON.stringify(versions);
  }

  function sendCollaborationMessage(payload) {
    if (collaborationSocket?.readyState !== WebSocket.OPEN) return false;
    collaborationSocket.send(JSON.stringify(payload));
    return true;
  }

  function syncCollaborativeField(input, immediate = false) {
    if (!isCollaborativeField(input) || applyingRemoteValue) return;
    const fieldName = input.name;
    const send = () => {
      const state = collaborativeFields.get(fieldName) || {
        version: 0,
        value: readCollaborativeValue(input),
      };
      const value = readCollaborativeValue(input);
      state.localValue = value;
      collaborativeFields.set(fieldName, state);
      sendCollaborationMessage({
        type: "field.update",
        field: fieldName,
        value,
        base_value: state.value ?? "",
        base_version: state.version || 0,
        kind: collaborativeKind(input),
      });
    };
    clearTimeout(collaborativeTimers.get(fieldName));
    if (immediate || !["text", "textarea"].includes(collaborativeKind(input))) {
      send();
    } else {
      collaborativeTimers.set(fieldName, window.setTimeout(send, 300));
    }
  }

  function bindCollaborativeFields(root = document) {
    root.querySelectorAll("input, select, textarea").forEach(input => {
      if (!isCollaborativeField(input) || input.dataset.collaborationBound === "1") return;
      input.dataset.collaborationBound = "1";
      if (!collaborativeFields.has(input.name)) {
        collaborativeFields.set(input.name, {
          version: 0,
          value: readCollaborativeValue(input),
        });
      }
      input.addEventListener("focus", () => {
        sendCollaborationMessage({type: "presence.focus", field: input.name});
      });
      input.addEventListener("blur", () => {
        syncCollaborativeField(input, true);
        sendCollaborationMessage({type: "presence.blur", field: input.name});
      });
      input.addEventListener("input", () => syncCollaborativeField(input));
      input.addEventListener("change", () => syncCollaborativeField(input, true));
    });
    updateFieldVersionsInput();
  }

  function ensureRemoteFormsetField(fieldName) {
    if (fieldName === "accessories-TOTAL_FORMS") return;
    if (fieldName === "other_fees-TOTAL_FORMS") return;
    const accessoryMatch = fieldName.match(/^accessories-(\d+)-/);
    if (accessoryMatch) {
      while (Number(byId("id_accessories-TOTAL_FORMS").value) <= Number(accessoryMatch[1])) {
        appendAccessoryRow(false);
      }
    }
    const feeMatch = fieldName.match(/^other_fees-(\d+)-/);
    if (feeMatch) {
      while (Number(byId("id_other_fees-TOTAL_FORMS").value) <= Number(feeMatch[1])) {
        appendOtherFeeRow(false);
      }
    }
  }

  function writeCollaborativeValue(fieldName, value) {
    if (fieldName === "accessories-TOTAL_FORMS") {
      while (Number(byId("id_accessories-TOTAL_FORMS").value) < Number(value)) {
        appendAccessoryRow(false);
      }
    }
    if (fieldName === "other_fees-TOTAL_FORMS") {
      while (Number(byId("id_other_fees-TOTAL_FORMS").value) < Number(value)) {
        appendOtherFeeRow(false);
      }
    }
    ensureRemoteFormsetField(fieldName);
    const input = orderForm.elements.namedItem(fieldName);
    if (!input || input instanceof RadioNodeList) return;
    applyingRemoteValue = true;
    if (input.type === "checkbox") {
      input.checked = Boolean(value);
    } else {
      input.value = value ?? "";
    }
    input.dispatchEvent(new Event("change", {bubbles: true}));
    applyingRemoteValue = false;
  }

  function renderRemotePresences() {
    document.querySelectorAll(".field.remote-editing").forEach(field => {
      field.classList.remove("remote-editing");
      field.style.removeProperty("--editor-color");
      field.querySelector(".field-editor-badge")?.remove();
    });
    const byField = new Map();
    remotePresences.forEach(presence => {
      if (!byField.has(presence.field)) byField.set(presence.field, []);
      byField.get(presence.field).push(presence);
    });
    byField.forEach((presences, fieldName) => {
      ensureRemoteFormsetField(fieldName);
      const input = orderForm.elements.namedItem(fieldName);
      const field = input?.closest?.(".field");
      if (!field) return;
      field.classList.add("remote-editing");
      field.style.setProperty("--editor-color", presences[0].color);
      const badge = document.createElement("small");
      badge.className = "field-editor-badge";
      badge.textContent = `${presences.map(item => item.editing_by).join("、")} 正在編輯`;
      field.appendChild(badge);
    });
  }

  function handleCollaborationMessage(message) {
    if (message.type === "snapshot") {
      Object.entries(message.fields || {}).forEach(([fieldName, state]) => {
        const existing = collaborativeFields.get(fieldName);
        const input = orderForm.elements.namedItem(fieldName);
        if (
          existing?.localValue !== undefined
          && input
          && readCollaborativeValue(input) !== state.value
        ) {
          syncCollaborativeField(input, true);
          return;
        }
        collaborativeFields.set(fieldName, {
          version: state.version,
          value: state.value,
        });
        if (document.activeElement !== input) writeCollaborativeValue(fieldName, state.value);
      });
      collaborativeFields.forEach((state, fieldName) => {
        if (state.localValue === undefined || message.fields?.[fieldName]) return;
        const input = orderForm.elements.namedItem(fieldName);
        if (input) syncCollaborativeField(input, true);
      });
      (message.presences || []).forEach(presence => {
        remotePresences.set(presence.client_id, presence);
      });
      updateFieldVersionsInput();
      renderRemotePresences();
      return;
    }
    if (message.type === "presence.focus" && message.client_id !== collaborationClientId) {
      remotePresences.set(message.client_id, message);
      renderRemotePresences();
      return;
    }
    if (["presence.blur", "presence.leave"].includes(message.type)) {
      remotePresences.delete(message.client_id);
      renderRemotePresences();
      return;
    }
    if (message.type === "field.updated") {
      const current = collaborativeFields.get(message.field) || {};
      const input = orderForm.elements.namedItem(message.field);
      const inputValue = input ? readCollaborativeValue(input) : null;
      const isMine = message.client_id === collaborationClientId;
      const hasUnsavedLocalEdit = (
        input
        && document.activeElement === input
        && inputValue !== current.value
      );

      if (!isMine && hasUnsavedLocalEdit) {
        collaborationStatus.hidden = false;
        collaborationStatus.textContent = `${message.updated_by} 也修改了目前欄位，離開欄位時將進行合併檢查`;
        return;
      }

      current.version = message.version;
      current.value = message.value;
      delete current.localValue;
      collaborativeFields.set(message.field, current);
      if (!isMine || message.merged) {
        writeCollaborativeValue(message.field, message.value);
      } else if (input && inputValue !== message.value) {
        syncCollaborativeField(input, true);
      }
      updateFieldVersionsInput();
      collaborationStatus.hidden = false;
      collaborationStatus.textContent = message.merged
        ? `${message.updated_by} 的修改已安全合併`
        : `${message.updated_by} 已更新欄位`;
      window.setTimeout(() => collaborationStatus.hidden = true, 2500);
      return;
    }
    if (message.type === "field.conflict") {
      const input = orderForm.elements.namedItem(message.field);
      collaborationConflict = {...message, input};
      const label = input?.closest(".field")?.querySelector("label")?.textContent.trim() || message.field;
      conflictMessage.textContent = `${label}已由 ${message.updated_by || "其他人員"} 更新。請選擇要採用哪個內容。`;
      conflictPanel.hidden = false;
      collaborativeFields.set(message.field, {
        version: message.server_version,
        value: message.server_value,
        localValue: message.my_value,
      });
      updateFieldVersionsInput();
    }
  }

  function connectCollaboration() {
    {% if intake_dealer or reception_mode %}return;{% endif %}
    if (!draftId.value || submittingOrder) return;
    if ([WebSocket.OPEN, WebSocket.CONNECTING].includes(collaborationSocket?.readyState)) return;
    clearTimeout(collaborationReconnectTimer);
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    collaborationSocket = new WebSocket(
      `${protocol}//${location.host}/ws/orders/drafts/${draftId.value}/?${collaborationClientId}`,
    );
    collaborationSocket.addEventListener("open", () => {
      collaborationReconnectDelay = 1000;
      collaborationStatus.hidden = false;
      collaborationStatus.textContent = "即時共編已連線";
      clearInterval(collaborationPingTimer);
      collaborationPingTimer = window.setInterval(
        () => sendCollaborationMessage({type: "ping"}),
        20000,
      );
      window.setTimeout(() => collaborationStatus.hidden = true, 1800);
    });
    collaborationSocket.addEventListener("message", event => {
      handleCollaborationMessage(JSON.parse(event.data));
    });
    collaborationSocket.addEventListener("close", () => {
      clearInterval(collaborationPingTimer);
      remotePresences.clear();
      renderRemotePresences();
      if (submittingOrder) return;
      collaborationStatus.hidden = false;
      collaborationStatus.textContent = "即時共編連線中斷，正在重新連線…";
      collaborationReconnectTimer = window.setTimeout(
        connectCollaboration,
        collaborationReconnectDelay,
      );
      collaborationReconnectDelay = Math.min(collaborationReconnectDelay * 2, 15000);
    });
  }

  byId("accept-server-value").addEventListener("click", () => {
    if (!collaborationConflict) return;
    writeCollaborativeValue(
      collaborationConflict.field,
      collaborationConflict.server_value,
    );
    conflictPanel.hidden = true;
    collaborationConflict = null;
  });

  byId("keep-my-value").addEventListener("click", () => {
    if (!collaborationConflict) return;
    const conflict = collaborationConflict;
    sendCollaborationMessage({
      type: "field.update",
      field: conflict.field,
      value: conflict.my_value,
      base_value: conflict.server_value,
      base_version: conflict.server_version,
      kind: collaborativeKind(conflict.input),
      force: true,
    });
    conflictPanel.hidden = true;
    collaborationConflict = null;
  });

  function flushCollaborativeChanges() {
    collaborativeTimers.forEach((timer, fieldName) => {
      clearTimeout(timer);
      const input = orderForm.elements.namedItem(fieldName);
      if (input && !(input instanceof RadioNodeList)) {
        syncCollaborativeField(input, true);
      }
    });
    collaborativeTimers.clear();
    updateFieldVersionsInput();
  }

  function setDraftStatus(state, text) {
    draftStatus.className = `draft-status ${state}`;
    draftStatusMessage.textContent = text;
  }

  function enableDraftDelete(draftPk) {
    if (!draftDeleteForm || !draftDeleteButton || !draftPk) return;
    draftDeleteForm.action = draftDeleteForm.dataset.deleteUrlTemplate.replace(
      "00000000-0000-0000-0000-000000000000",
      draftPk,
    );
    draftDeleteButton.hidden = false;
  }

  draftDeleteForm?.addEventListener("submit", async event => {
    event.preventDefault();
    if (!confirm("確定刪除這份草稿及暫存的證件照片嗎？刪除後無法復原。")) return;
    draftDeleteButton.disabled = true;
    draftDeleteButton.textContent = "刪除中…";
    try {
      const response = await fetch(draftDeleteForm.action, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "X-CSRFToken": draftDeleteForm.querySelector("[name=csrfmiddlewaretoken]").value,
        },
      });
      const data = await response.json();
      if (!response.ok || !data.ok) {
        throw new Error(data.error || "目前無法刪除草稿，請稍後再試。");
      }
      submittingOrder = true;
      location.assign(data.redirect_url);
    } catch (error) {
      draftDeleteButton.disabled = false;
      draftDeleteButton.textContent = "刪除草稿";
      setDraftStatus("error", error.message);
    }
  });

  function setExclusiveEditingLocked(locked) {
    orderForm.classList.toggle("is-editing-locked", locked);
    orderForm.querySelectorAll("input, select, textarea, button").forEach(control => {
      if (control.type === "hidden") return;
      if (locked) {
        if (control.disabled) control.dataset.wasDisabled = "1";
        control.disabled = true;
        control.dataset.lockDisabled = "1";
      } else if (control.dataset.lockDisabled === "1") {
        if (control.dataset.wasDisabled !== "1") control.disabled = false;
        delete control.dataset.lockDisabled;
        delete control.dataset.wasDisabled;
      }
    });
  }

  async function refreshDraftPresence() {
    if (editingOrderId) {
      try {
        const response = await fetch(`/orders/${editingOrderId}/edit/presence/`, {
          method: "POST",
          headers: {"X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value},
        });
        const data = await response.json();
        if (!response.ok || !data.ok) return;
        editingPresence.hidden = false;
        editingPresence.className = data.mine
          ? "editing-presence mine"
          : "editing-presence warning";
        editingPresence.textContent = data.mine
          ? `目前由你（${data.editing_by}）編輯這筆訂單`
          : `${data.editing_by} 正在編輯這筆訂單，目前只能查看`;
        setExclusiveEditingLocked(!data.mine);
      } catch (error) {
        // 編輯狀態屬輔助提醒，版本檢查仍會防止覆蓋。
      }
      return;
    }
    if (!draftId.value) {
      editingPresence.hidden = true;
      return;
    }
    try {
      const response = await fetch(`/orders/drafts/${draftId.value}/presence/`, {
        method: "POST",
        headers: {"X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value},
      });
      const data = await response.json();
      if (!response.ok || !data.ok) return;
      editingPresence.hidden = false;
      editingPresence.className = data.mine
        ? "editing-presence mine"
        : "editing-presence warning";
      editingPresence.textContent = data.mine
        ? `目前由你（${data.editing_by}）編輯這筆草稿`
        : `${data.editing_by} 正在編輯這筆草稿，目前只能查看`;
      setExclusiveEditingLocked(!data.mine);
    } catch (error) {
      // 編輯狀態屬輔助提醒，連線短暫失敗時不阻擋填單。
    }
  }

  function showSavedPhoto(fieldName, url) {
    const input = byId(`id_${fieldName}`);
    const card = input.closest(".capture-card");
    const clearButton = card.querySelector("[data-clear-file]");
    let state = card.querySelector(`[data-saved-photo="${fieldName}"]`);
    const preview = card.querySelector(`[data-photo-preview="${fieldName}"]`);
    const sideLabel = fieldName === "id_front" ? "正面" : "反面";

    if (!url) {
      state?.remove();
      card.classList.remove("has-saved-photo");
      clearButton.dataset.existingPhoto = "0";
      if (preview) {
        preview.removeAttribute("src");
        preview.hidden = true;
      }
      refreshPhotoButtons();
      return;
    }

    if (!state) {
      state = document.createElement("div");
      state.className = "saved-photo-state";
      state.dataset.savedPhoto = fieldName;
      state.innerHTML = `
        <span><strong>已暫存${sideLabel}照片</strong><small>{% site_text 'order_form.f014372ecb14' %}</small></span>
        <a target="_blank">查看</a>
        <button type="button">更換</button>
      `;
      state.querySelector("button").addEventListener("click", () => input.click());
      clearButton.before(state);
    }
    state.querySelector("a").href = url;
    if (preview) {
      preview.src = url;
      preview.hidden = false;
    }
    card.classList.add("has-saved-photo");
    clearButton.dataset.existingPhoto = "1";
    refreshPhotoButtons();
  }

  function scheduleDraft() {
    if (editingOrderId || submittingOrder) return;
    clearTimeout(draftTimer);
    setDraftStatus("pending", "尚有變更，將自動儲存…");
    draftTimer = window.setTimeout(saveDraft, 5000);
  }

  async function saveDraft() {
    if (editingOrderId) return;
    clearTimeout(draftTimer);
    if (draftSaving) {
      draftQueued = true;
      return;
    }
    draftSaving = true;
    setDraftStatus("saving", "草稿儲存中…");
    const requestPhotoVersion = {...photoVersion};
    const requestPhotoDirty = {...photoDirty};
    const requestPhotoRemoved = {
      id_front: byId("remove-id-front").value === "1",
      id_back: byId("remove-id-back").value === "1",
    };
    const payload = new FormData(orderForm);
    if (!requestPhotoDirty.id_front) payload.delete("id_front");
    if (!requestPhotoDirty.id_back) payload.delete("id_back");
    try {
      const response = await fetch("{% url draft_save_route|default:'draft_save' %}", {
        method: "POST",
        headers: {"X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value},
        body: payload,
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "草稿儲存失敗");
      draftId.value = data.id;
      draftRevision.value = data.revision;
      enableDraftDelete(data.id);
      ["id_front", "id_back"].forEach(fieldName => {
        if (photoVersion[fieldName] !== requestPhotoVersion[fieldName]) return;
        if (requestPhotoDirty[fieldName] || requestPhotoRemoved[fieldName]) {
          photoDirty[fieldName] = false;
          byId(`remove-${fieldName.replaceAll("_", "-")}`).value = "0";
        }
        showSavedPhoto(fieldName, data.photos[fieldName]);
      });
      history.replaceState(null, "", data.edit_url);
      setDraftStatus("saved", `草稿已儲存 ${data.updated_at}`);
      refreshDraftPresence();
      connectCollaboration();
      document.dispatchEvent(new CustomEvent("draft-saved"));
    } catch (error) {
      setDraftStatus("error", error.message);
    } finally {
      draftSaving = false;
      if (draftQueued) {
        draftQueued = false;
        saveDraft();
      }
    }
  }

  orderForm.addEventListener("input", scheduleDraft);
  orderForm.addEventListener("change", scheduleDraft);
  if (editingOrderId) {
    orderForm.addEventListener("input", () => { editFormDirty = true; });
    orderForm.addEventListener("change", () => { editFormDirty = true; });
    document.querySelectorAll("[data-cancel-edit]").forEach(link => {
      link.addEventListener("click", event => {
        if (editFormDirty && !confirm("尚有未儲存的修改，確定要放棄並離開嗎？")) {
          event.preventDefault();
        }
      });
    });
    window.addEventListener("beforeunload", event => {
      if (!editFormDirty || submittingOrder) return;
      event.preventDefault();
      event.returnValue = "";
    });
  }
  function showValidationSummary(firstInvalid = null) {
    const invalidFields = [...orderForm.querySelectorAll(".has-error, :invalid")]
      .filter(node => !node.closest(".is-pending-delete"));
    const labels = [];
    invalidFields.forEach(node => {
      const field = node.classList.contains("field") ? node : node.closest(".field");
      const label = field?.querySelector("label")?.textContent
        ?.replace("必填", "").trim();
      if (label && !labels.includes(label)) labels.push(label);
      const section = node.closest("details.form-section");
      if (section) section.open = true;
    });
    if (!labels.length) return;
    const action = editingOrderId ? "儲存修改" : "建立訂單";
    validationSummary.hidden = false;
    validationSummary.innerHTML = `
      <strong>目前無法${action}</strong>
      <span>請先處理：${labels.join("、")}。</span>
    `;
    const target = firstInvalid || invalidFields[0];
    window.setTimeout(() => {
      target?.scrollIntoView({behavior: "smooth", block: "center"});
      if (target?.matches("input, select, textarea, button")) {
        target.focus({preventScroll: true});
      } else {
        target?.querySelector("input, select, textarea")?.focus({preventScroll: true});
      }
    }, 80);
  }

  let invalidFocusPending = false;
  orderForm.addEventListener("invalid", event => {
    if (invalidFocusPending) return;
    invalidFocusPending = true;
    showValidationSummary(event.target);
    window.setTimeout(() => {
      invalidFocusPending = false;
    }, 120);
  }, true);
  orderForm.addEventListener("input", () => {
    validationSummary.hidden = true;
  });
  orderForm.addEventListener("submit", () => {
    submittingOrder = true;
    clearTimeout(draftTimer);
  });
  orderForm.addEventListener('workspace-saved', () => { editFormDirty = false; });
  orderForm.addEventListener('workspace-save-finished', () => { submittingOrder = false; });
  if (orderForm.querySelector(".has-error")) showValidationSummary();
  refreshDraftPresence();
  window.setInterval(refreshDraftPresence, 30000);
  window.addEventListener("pagehide", () => {
    if (editingOrderId) {
      const payload = new FormData();
      payload.append("action", "release");
      payload.append(
        "csrfmiddlewaretoken",
        document.querySelector("[name=csrfmiddlewaretoken]").value,
      );
      navigator.sendBeacon(`/orders/${editingOrderId}/edit/presence/`, payload);
      return;
    }
    if (!draftId.value) return;
    const payload = new FormData();
    payload.append("action", "release");
    payload.append(
      "csrfmiddlewaretoken",
      document.querySelector("[name=csrfmiddlewaretoken]").value,
    );
    navigator.sendBeacon(`/orders/drafts/${draftId.value}/presence/`, payload);
  });
})();
</script>
