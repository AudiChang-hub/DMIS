<div class="campaign-item-row" data-campaign-item-row>
  {{ item_form.id }}
  <div class="campaign-item-row__fields">
    {% include "sales/_field.html" with field=item_form.item %}
    {% include "sales/_field.html" with field=item_form.amount %}
  </div>
  <button type="button" class="button danger-outline small" data-remove-campaign-item aria-label="移除這個項目">移除</button>
  {% if item_form.non_field_errors %}<div class="message error">{{ item_form.non_field_errors }}</div>{% endif %}
  <span hidden>{{ item_form.DELETE }}</span>
</div>
