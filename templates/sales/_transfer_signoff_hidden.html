<input type="hidden" name="dealer" value="{% if data.factory %}factory{% else %}{{ data.dealer.pk|default:'' }}{% endif %}"><input type="hidden" name="dealer_name" value="{{ data.dealer_name }}"><input type="hidden" name="note" value="{{ data.note }}">{% if data.pending %}<input type="hidden" name="pending" value="{{ data.pending.pk }}">{% endif %}{% for vehicle in vehicles %}<input type="hidden" name="vehicles" value="{{ vehicle.pk }}">{% endfor %}
