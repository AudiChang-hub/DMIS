# 訂單即時共編走 WebSocket（/ws/）：必須轉送 Upgrade／Connection，否則 Django 收到一般 GET 回 404。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 存取紀錄（T-59）：記總耗時與應用耗時供查慢；只記路徑、不記查詢字串（搜尋字可能含客戶資料）與來源 IP。
# 檔案在容器外（compose 掛載），容器啟動時由 40-dmis-access-log.sh 改名壓縮並保留 30 天。
map $uri $dmis_loggable {
    /health/ 0;
    default  1;
}
log_format dmis_timing escape=json '{"t":"$time_iso8601","m":"$request_method","p":"$uri","s":$status,'
    '"rt":$request_time,"urt":"$upstream_response_time","in":$request_length,"out":$bytes_sent,'
    '"rid":"$upstream_http_x_request_id","ws":"$http_upgrade"}';

server {
    listen 8069;
    server_name _;

    client_max_body_size 40m;
    access_log /var/log/nginx/access.log main;
    access_log /var/log/dmis/access.log dmis_timing if=$dmis_loggable;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    location / {
        set $dmis_backend web:8000;
        proxy_pass http://$dmis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
