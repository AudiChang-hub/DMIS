{% load static %}

<script src="{% static 'js/discount-preview.js' %}" defer></script>
<script src="{% static 'js/order-finance.js' %}?v={{ app_version }}" defer></script>
<script>
(() => {
  const rows = document.getElementById("payment-records");
  const total = document.getElementById("id_payments-TOTAL_FORMS");
  function bind(row) {
    const button = row.querySelector("[data-delete-payment]");
    if (!button) return;
    button.addEventListener("click", () => {
      // 收款可直接刪除（使用者 2026-10-21 T-47）：刪除後無法復原，處理紀錄會留下這筆的內容。
      const saved = row.querySelector('[name$="-id"]')?.value;
      if (saved && !window.confirm("刪除這筆收款？刪除後無法復原，處理紀錄會留下這筆的內容。")) return;
      // 訂金、尾款、分期撥款刪除後由系統重建為未收的應收列：存好後重新載入，畫面才看得到新列與各步驟狀態。
      if (saved && row.hasAttribute("data-payment-system")) row.closest("form")?.addEventListener("workspace-saved", () => location.reload(), {once: true});
      row.querySelector('[name$="-DELETE"]').checked = true;
      row.hidden = true;
      row.querySelector('[name$="-DELETE"]').dispatchEvent(new Event('change', {bubbles: true}));
    });
  }
  rows.querySelectorAll("[data-payment-row]").forEach(bind);
  document.getElementById("add-payment")?.addEventListener("click", () => {
    const i = Number(total.value), box = document.createElement("div");
    box.innerHTML = document.getElementById("payment-empty-row").innerHTML.replaceAll("__prefix__", i).trim();
    rows.appendChild(box.firstElementChild); total.value = i + 1; bind(rows.lastElementChild);
    rows.lastElementChild.querySelector('[name$="-item_name"]').focus();
    total.dispatchEvent(new Event('change', {bubbles: true}));
  });
  // 已存的車控／電池密碼直接顯示在按鈕旁（不需再輸入本人密碼），每次查看寫入處理紀錄。
  document.querySelectorAll(".secret-reveal").forEach(button => button.addEventListener("click", async () => {
    let output = button.nextElementSibling?.matches("[data-secret-output]") ? button.nextElementSibling : null;
    if (!output) {
      output = document.createElement("output");
      output.className = "secret-reveal__value";
      output.setAttribute("data-secret-output", "");
      output.setAttribute("aria-live", "polite");
      button.after(output);
    }
    button.disabled = true;
    try {
      const response = await fetch("{% url 'order_secret_reveal' order.pk %}", {
        method: "POST", credentials: "same-origin",
        headers: {"X-CSRFToken": "{{ csrf_token }}", "Content-Type": "application/x-www-form-urlencoded", Accept: "application/json"},
        body: new URLSearchParams({field: button.dataset.secret}),
      });
      const data = await response.json().catch(() => ({}));
      output.textContent = data.ok ? (data.value || "尚未設定") : (data.error || "無法顯示密碼。");
    } catch (failure) {
      output.textContent = "連線失敗，請稍後再試。";
    } finally {
      button.disabled = false;
    }
  }));
})();
</script>
