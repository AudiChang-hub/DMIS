{% load static %}{% comment %}領牌年月樹狀（T-212）：年 → 月，最新年份在上、預設收合。年份是三態勾選（aria-checked true／mixed／false），
勾年份＝全選該年各月、取消＝全部取消；月份仍是原本 name="months" 的勾選框，送出參數、自動套用、只選此項都走 report-interactions.js。{% endcomment %}<div class="report-month-tree" data-month-tree>{% for year in month_tree %}
<div class="report-month-tree__year" data-month-year="{{ year.year }}">
<div class="report-month-tree__head"><button type="button" class="report-month-tree__toggle" aria-expanded="false" aria-controls="{{ field.auto_id }}-{{ year.year }}" aria-label="展開 {{ year.year }} 年的月份" data-month-year-toggle><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="report-month-tree__check" role="checkbox" aria-checked="{{ year.state }}" data-month-year-check><span class="report-month-tree__box" aria-hidden="true"><svg viewBox="0 0 16 16" width="12" height="12" focusable="false"><path class="report-month-tree__tick" d="M3.5 8.4l2.9 2.8 6-6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="report-month-tree__dash" d="M4 8h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="report-month-tree__name">{{ year.year }} 年</span><small class="report-month-tree__count" data-month-year-count>{{ year.checked }}／{{ year.months|length }}</small></button></div>
<div class="report-month-tree__months" id="{{ field.auto_id }}-{{ year.year }}" role="group" aria-label="{{ year.year }} 年各月" hidden>{% for month in year.months %}<label data-multi-option><input type="checkbox" name="{{ field.html_name }}" value="{{ month.value }}" {% if month.checked %}checked{% endif %}><span><span class="sr-only">{{ year.year }} 年 </span>{{ month.month }}</span></label>{% endfor %}</div>
</div>{% endfor %}
</div><script src="{% static 'js/report-month-tree.js' %}" defer></script>
