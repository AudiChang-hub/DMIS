{% extends 'base.html' %}{% load static %}{% load site_copy %}{% block title %}SUZUKI 零件圖冊{% endblock %}
{% block head %}<link rel="stylesheet" href="{% static 'css/parts-manual.css' %}?v={{ app_version }}"><script src="{% static 'js/parts-manual.js' %}?v={{ app_version }}" defer></script>{% endblock %}
{% block page_class %}page-shell--wide parts-manual-page{% endblock %}
{% block content %}
{% site_navigation %}<section class="hero-row compact-hero parts-manual-hero"><div><h1>SUZUKI 零件圖冊</h1></div><div class="hero-actions"><button type="button" class="button secondary" data-parts-fullscreen>全螢幕</button><a class="button primary" href="{{ manual_url }}" target="_blank" rel="noopener noreferrer" title="要登入看價格或畫面無法載入時使用">在新視窗開啟</a></div></section>
<section class="parts-manual-frame" data-parts-manual>
  <div class="parts-manual-fullbar"><strong>SUZUKI 零件圖冊</strong><button type="button" class="button secondary small" data-parts-fullscreen-exit>結束全螢幕</button></div>
  <iframe src="{{ manual_url }}" title="台鈴官方 SUZUKI 零件圖冊" referrerpolicy="no-referrer" data-parts-manual-frame
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"></iframe>
</section>
{% endblock %}
