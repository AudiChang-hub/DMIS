{% if page_tip %}<p class="page-help-tip" data-page-help-tip><span class="page-help-tip__mark" aria-hidden="true">?</span><span class="page-help-tip__text"><b>這頁做什麼</b>{{ page_tip.tip.does }}{% if page_tip.tip.next %}<span class="page-help-tip__next"><b>下一步</b>{{ page_tip.tip.next }}</span>{% endif %}</span><a class="page-help-tip__link" href="{% url 'help_article' page_tip.article.slug %}" target="_blank" rel="noopener">看〈{{ page_tip.article.title }}〉<span class="visually-hidden">（另開分頁）</span><span aria-hidden="true">↗</span></a></p>{% endif %}
