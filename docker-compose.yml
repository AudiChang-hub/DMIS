services:
  odoo:
    build: .
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-odoo}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-odoo}
    ports:
      - "${ODOO_PORT:-8069}:8069"
    depends_on:
      - db
    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - /home/audi/project/OrderProcessor/backup:/mnt/order_backup:ro
    restart: always

  db:
    image: postgres:15
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - odoo

  metabase:
    image: metabase/metabase:latest
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_JETTY_PORT: 3000
    depends_on:
      - db
    volumes:
      - metabase_data:/metabase.db
    restart: always
    profiles:
      - metabase

  cloudflared-metabase:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://metabase:3000
    depends_on:
      - metabase
    restart: always
    profiles:
      - metabase

volumes:
  db_data:
  odoo_data:
  metabase_data:
