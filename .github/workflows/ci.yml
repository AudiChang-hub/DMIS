name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
  # migration 測試平常只在 migration 相關檔案變動時跑；每週與手動觸發時完整補跑一次。
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  DJANGO_DEBUG: "1"
  DJANGO_SECRET_KEY: ci-only-not-for-production

jobs:
  basics:
    name: 版本與文件檢查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app: ${{ steps.changes.outputs.app }}
      migrations: ${{ steps.changes.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release history and version increment
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_release.py --base "$RELEASE_BASE"

      - name: Verify AI context policy and documentation
        run: python -m unittest discover -s tests/context -v

      - name: Detect changed areas
        id: changes
        shell: bash
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          full_run() {
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # 排程、手動觸發或找不到比較基準（新分支、force push）時一律完整驗證。
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) full_run ;; esac
          [[ -n "$CHANGE_BASE" && ! "$CHANGE_BASE" =~ ^0+$ ]] || full_run
          CHANGED="$(git diff --name-only "$CHANGE_BASE" HEAD)" || full_run
          printf 'Changed files:\n%s\n' "$CHANGED"
          # 只改文件／規格／AI 說明時不重跑 Django 測試；其餘任何檔案都視為程式異動。
          DOCS_ONLY='^(docs/|specs/|PR/|\.github/(copilot-instructions\.md|pull_request_template\.md|prompts/)|[^/]+\.md$)'
          if printf '%s\n' "$CHANGED" | grep -Evq "$DOCS_ONLY"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          # migration 測試要倒退重跑上百個 migration，只在 migration、其引用的服務或測試本身變動時跑。
          MIGRATION_PATHS='^(sales/migrations/|sales/services/(inventory_location_note|taiwan_address)\.py$|sales/tests/(test_.*migration.*|test_old_owner_markers|test_transaction_type_only|test_volume_bonus_conditions)\.py$|requirements-django\.txt$|\.github/workflows/ci\.yml$)'
          if printf '%s\n' "$CHANGED" | grep -Eq "$MIGRATION_PATHS"; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  docs-tests:
    name: 使用手冊對照測試
    needs: basics
    if: needs.basics.outputs.app == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-django.txt

      # PDF 服務載入時即檢查繁體中文字型，任何執行 manage.py 的 job 都需要。
      - name: Install PDF font dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          test -r /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc

      - name: Install Django dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-django.txt

      - name: Run tests that read the user manual
        run: python manage.py test sales --tag docs --noinput

  django-sqlite:
    name: Django 品質檢查
    needs: basics
    if: needs.basics.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-django.txt

      - name: Install PDF font dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          test -r /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc

      - name: Install Django dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-django.txt
          # tblib：平行測試失敗時保留完整錯誤原因。
          python -m pip install --disable-pip-version-check pip-audit bandit tblib

      - name: Audit Python dependencies
        # GHSA-8pqf-f4m5-798g（CVE-2026-106454）只影響 twisted.mail 的 IMAP 伺服器，本系統未使用 IMAP；
        # 2026-10-16 尚無修正版，twisted 出修正版後升級並移除此豁免。
        run: python -m pip_audit -r requirements-django.txt --ignore-vuln GHSA-8pqf-f4m5-798g

      - name: Reject high-severity Python findings in tracked code
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t PYTHON_FILES < <(git ls-files '*.py' | grep -Ev '(^|/)(tests?|migrations)/')
          test "${#PYTHON_FILES[@]}" -gt 0
          python -m bandit -lll "${PYTHON_FILES[@]}"

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      # 藍綠部署「先擴充、後收斂」：不相容的 migration 不擋 CI，但部署會自動改成短暫停機，這裡先提醒。
      - name: Check new migrations for zero-downtime compatibility
        shell: bash
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          [[ -n "$CHANGE_BASE" && ! "$CHANGE_BASE" =~ ^0+$ ]] || { echo "沒有比較基準，略過"; exit 0; }
          git fetch --no-tags --depth=1 origin "$CHANGE_BASE" || { echo "取不到比較基準，略過"; exit 0; }
          mapfile -t NEW < <(git diff --name-only --diff-filter=A "$CHANGE_BASE" HEAD -- 'sales/migrations/0*.py' \
            | sed -E 's#^sales/migrations/(.*)\.py$#sales.\1#')
          [[ ${#NEW[@]} -gt 0 ]] || { echo "沒有新增 migration"; exit 0; }
          status=0
          python manage.py check_migration_compat "${NEW[@]}" | tee compat.txt || status=$?
          if [[ "$status" == "3" ]]; then
            echo "::warning title=部署會短暫停機::$(tr '\n' ' ' < compat.txt)"
          elif [[ "$status" != "0" ]]; then
            exit "$status"
          fi

      - name: Verify frontend behavior checks
        run: node --test tests/frontend/*.test.cjs

      - name: Run Django tests with SQLite
        run: |
          python -m unittest discover -s tests/ops
          # migration 測試另由 django-migrations job 依變更範圍執行。
          python manage.py test sales --noinput --parallel auto --exclude-tag migration

  django-postgres:
    name: Django PostgreSQL 檢查
    needs: basics
    if: needs.basics.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: ci-isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ci -d finance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: finance_ci
      POSTGRES_USER: finance_ci
      POSTGRES_PASSWORD: ci-isolated-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-django.txt

      - name: Install PDF font dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          test -r /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc

      - name: Install Django dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-django.txt
          python -m pip install --disable-pip-version-check tblib

      - name: Run Django production deployment checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-only-7Vf4pQ9xT2mR8kN5sL1dC6wH3zB0yG7uJ4aE9rP2nX8qM5
          DJANGO_ALLOWED_HOSTS: dmis.example.test,localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: https://dmis.example.test
          DJANGO_SECURE_SSL_REDIRECT: "1"
          DJANGO_DB_USER: finance_app_ci
          DJANGO_DB_PASSWORD: ci-runtime-only
        run: python manage.py check --deploy

      - name: Verify finance, orders, concurrency and locking with PostgreSQL
        # 財務、佣金、台數歸屬、結算、併發與鎖定必須在 PostgreSQL 驗證；平行執行，每個 worker 各自一份測試 DB。
        run: >-
          python manage.py test --noinput --parallel auto --exclude-tag migration
          sales.tests.test_home_favorites
          sales.tests.test_order_intake sales.tests.test_reception_entry sales.tests.test_intake_deposit_discount
          sales.tests.test_catalog_accounts sales.tests.test_catalog_selection sales.tests.test_profit_privacy_ux
          sales.tests.test_catalog_color_list sales.tests.test_catalog_management sales.tests.test_order_deletion
          sales.tests.test_legacy_import.LegacyImportTests.test_deleted_import_is_not_recreated_by_stale_row_commit
          sales.tests.test_order_workspace sales.tests.test_ppt_refinements sales.tests.test_print_company
          sales.tests.test_customer_order_access sales.tests.test_assisted_orders sales.tests.test_permission_workspace
          sales.tests.test_historical_delivery sales.tests.test_old_owner_markers sales.tests.test_import_order_review
          sales.tests.test_installment_batch sales.tests.test_draft_cleanup sales.tests.test_audit_log_draft_deletion_migration
          sales.tests.test_order_sorting sales.tests.test_command_center sales.tests.test_system_home
          sales.tests.test_allocation_priority sales.tests.test_document_signing sales.tests.test_inventory_disposition
          sales.tests.test_transfer_signoff sales.tests.test_inventory_restore sales.tests.test_order_return
          sales.tests.test_transaction_type_only
          sales.tests.test_receipt_list sales.tests.test_financial_consistency sales.tests.test_order_commission_recipient
          sales.tests.test_channel_finance sales.tests.test_volume_bonus_conditions sales.tests.test_volume_bonus_multiple_periods
          sales.tests.test_bonus_model_filter sales.tests.test_bonus_rule_deletion sales.tests.test_reporting
          sales.tests.test_report_classification sales.tests.test_historical_replacement sales.tests.test_historical_date_change
          sales.tests.test_screen_access sales.tests.test_collaboration sales.tests.test_completed_order_corrections
          sales.tests.test_order_installment_picker sales.tests.test_legacy_finance sales.tests.test_site_review
          sales.tests.test_site_review_followup

  django-migrations:
    name: Django migration 資料轉換測試
    needs: basics
    if: needs.basics.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: ci-isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ci -d finance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-django.txt

      - name: Install PDF font dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          test -r /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc

      - name: Install Django dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-django.txt
          python -m pip install --disable-pip-version-check tblib

      - name: Run migration tests with SQLite
        run: python manage.py test sales --noinput --parallel auto --tag migration

      - name: Run migration tests with PostgreSQL
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_DB: finance_ci
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: ci-isolated-only
        run: >-
          python manage.py test --noinput --parallel auto --tag migration
          sales.tests.test_old_owner_markers sales.tests.test_audit_log_draft_deletion_migration
          sales.tests.test_transaction_type_only sales.tests.test_volume_bonus_conditions

  django-image:
    name: Django 正式映像檢查
    needs: basics
    if: needs.basics.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Django runtime image
        run: docker build --pull -f Dockerfile.django -t dmis-django:ci .

      - name: Verify runtime allowlist and non-root user
        run: |
          docker run --rm --entrypoint sh dmis-django:ci -c '
            set -eu
            test "$(id -u)" -ne 0
            test -f /app/manage.py
            test -f /app/scripts/start_django.sh
            # 靜態檔在建置時整理好，新版容器啟動不必再跑 collectstatic。
            test -f /app/staticfiles/staticfiles.json
            test ! -e /app/.git
            test ! -e /app/.env
            test ! -e /app/.env.django
            test ! -e /app/secrets
            test ! -e /app/db.sqlite3
            test -z "$(find /app/media -mindepth 1 -print -quit)"
          '

      - name: Verify production settings inside image
        run: |
          docker run --rm --entrypoint python \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_ENV=production \
            -e DJANGO_SECRET_KEY=ci-only-7Vf4pQ9xT2mR8kN5sL1dC6wH3zB0yG7uJ4aE9rP2nX8qM5 \
            -e DJANGO_ALLOWED_HOSTS=dmis.example.test,localhost,127.0.0.1 \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=https://dmis.example.test \
            -e DJANGO_SECURE_SSL_REDIRECT=1 \
            -e POSTGRES_HOST=database.invalid \
            -e POSTGRES_DB=ci \
            -e POSTGRES_USER=ci_admin \
            -e POSTGRES_PASSWORD=ci-admin-only \
            -e DJANGO_DB_USER=ci_app \
            -e DJANGO_DB_PASSWORD=ci-runtime-only \
            dmis-django:ci manage.py check --deploy

      - name: Verify least-privilege PostgreSQL runtime role
        shell: bash
        run: |
          set -Eeuo pipefail
          DB_ROLE_CONTAINER="dmis-ci-db-role-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          POSTGRES_USER="ci_admin"
          POSTGRES_DB="ci_role_test"
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          DJANGO_DB_USER="ci_app"
          DJANGO_DB_PASSWORD="$(openssl rand -hex 24)"
          export DB_ROLE_CONTAINER POSTGRES_USER POSTGRES_DB POSTGRES_PASSWORD
          export DJANGO_DB_USER DJANGO_DB_PASSWORD

          cleanup() {
            docker stop --time 10 "$DB_ROLE_CONTAINER" >/dev/null 2>&1 || true
            docker rm -f "$DB_ROLE_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          docker run --detach --name "$DB_ROLE_CONTAINER" \
            -e POSTGRES_USER -e POSTGRES_DB -e POSTGRES_PASSWORD \
            -e DJANGO_DB_USER -e DJANGO_DB_PASSWORD \
            --mount "type=bind,src=$PWD/scripts/init_django_db.sh,dst=/docker-entrypoint-initdb.d/10-dmis-app-role.sh,readonly" \
            postgres:16 >/dev/null

          if ! timeout 90s bash -c '
            while true; do
              if [ "$(docker inspect --format="{{.State.Running}}" "$DB_ROLE_CONTAINER" 2>/dev/null || true)" != "true" ]; then
                exit 1
              fi
              role_state="$(
                docker exec -i "$DB_ROLE_CONTAINER" psql \
                  --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
                  --tuples-only --no-align --set ON_ERROR_STOP=1 \
                  --set app_user="$DJANGO_DB_USER" --set db_name="$POSTGRES_DB" \
                  <<< "SELECT CASE WHEN r.rolcanlogin AND NOT r.rolsuper AND NOT r.rolcreatedb AND NOT r.rolcreaterole AND NOT r.rolreplication AND d.datdba = r.oid AND NOT EXISTS (SELECT 1 FROM pg_database other_db WHERE other_db.datdba = r.oid AND other_db.datname <> :'\''db_name'\'') AND NOT EXISTS (SELECT 1 FROM pg_tablespace tablespace WHERE tablespace.spcowner = r.oid) THEN '\''ok'\'' ELSE '\''invalid'\'' END FROM pg_roles r JOIN pg_database d ON d.datname = :'\''db_name'\'' WHERE r.rolname = :'\''app_user'\'';" \
                  2>/dev/null || true
              )"
              case "$role_state" in
                ok) exit 0 ;;
                invalid) exit 2 ;;
              esac
              sleep 2
            done
          '; then
            docker logs --tail 80 "$DB_ROLE_CONTAINER" >&2
            exit 1
          fi

          timeout 30s bash -c '
            until docker exec -e PGPASSWORD="$DJANGO_DB_PASSWORD" "$DB_ROLE_CONTAINER" \
              psql --host 127.0.0.1 --username "$DJANGO_DB_USER" \
              --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 \
              --command "SELECT 1" >/dev/null 2>&1; do
              sleep 1
            done
          '

          if docker exec -e DJANGO_DB_PASSWORD="$POSTGRES_PASSWORD" \
            "$DB_ROLE_CONTAINER" \
            bash /docker-entrypoint-initdb.d/10-dmis-app-role.sh >/dev/null 2>&1; then
            echo "Error: 初始化腳本接受了與管理角色相同的 app 密碼。" >&2
            exit 1
          fi

          # 模擬既有 volume：管理角色曾建立資料表，重跑腳本後 app role 必須
          # 能讀寫既有資料並執行 Django migration 所需的 ALTER TABLE。
          docker exec "$DB_ROLE_CONTAINER" psql \
            --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --set ON_ERROR_STOP=1 \
            --command "CREATE TABLE legacy_role_probe (id bigint PRIMARY KEY, note text); INSERT INTO legacy_role_probe VALUES (1, 'before-role-split'); ALTER ROLE \"$DJANGO_DB_USER\" WITH SUPERUSER CREATEDB CREATEROLE REPLICATION;" \
            >/dev/null
          docker exec "$DB_ROLE_CONTAINER" \
            bash /docker-entrypoint-initdb.d/10-dmis-app-role.sh >/dev/null
          test "$(
            docker exec -i "$DB_ROLE_CONTAINER" psql \
              --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
              --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --set app_user="$DJANGO_DB_USER" \
              <<< "SELECT CASE WHEN rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication THEN 'ok' ELSE 'invalid' END FROM pg_roles WHERE rolname = :'app_user';"
          )" = "ok"
          docker exec -e PGPASSWORD="$DJANGO_DB_PASSWORD" "$DB_ROLE_CONTAINER" \
            psql --host 127.0.0.1 --username "$DJANGO_DB_USER" \
            --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 \
            --command "SELECT note FROM legacy_role_probe WHERE id = 1; INSERT INTO legacy_role_probe VALUES (2, 'after-role-split'); ALTER TABLE legacy_role_probe ADD COLUMN verified boolean NOT NULL DEFAULT true;" \
            >/dev/null

  pr-spec-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and enforce specs
        run: |
          BASE=origin/${{ github.event.pull_request.base.ref }}
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1 || true
          CHANGED=$(git diff --name-only $BASE...HEAD || true)
          printf 'Changed files:\n%s\n' "$CHANGED"
          # Django runtime、部署或 legacy Odoo 關鍵檔變更時，皆要求同步規格。
          if printf '%s\n' "$CHANGED" | grep -Eq '^(sales/|config/|templates/|static/|Dockerfile\.django$|docker-compose\.django(\.prod)?\.yml$|requirements-django\.txt$|addons/|docker-compose\.yml$|scripts/|Makefile$)'; then
            if ! printf '%s\n' "$CHANGED" | grep -q '^specs/'; then
              echo "Error: 修改 Django/Odoo runtime 或部署關鍵檔時，必須同步更新 specs/**。"
              exit 1
            fi
            echo "Critical changes include a specs update."
          else
            echo "No critical runtime or deployment changes."
          fi
