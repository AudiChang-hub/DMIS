{% load static %}<!doctype html>
<html lang="zh-Hant" data-theme="{{ ui_theme|default:'professional' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<base href="{{ preview_boot.url }}">
<link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ app_version }}">
<link rel="stylesheet" href="{% static 'css/reporting.css' %}?v={{ app_version }}">
<link rel="stylesheet" href="{% static 'css/report-overview.css' %}?v={{ app_version }}">
<link rel="stylesheet" href="{% static 'css/report-designer-frame.css' %}?v={{ app_version }}">
</head><body class="report-reader-shell{% if reader_overview %} report-overview-shell{% endif %}">
{{ preview_boot|json_script:'preview-boot' }}
<script src="{% static 'js/report-designer-frame.js' %}?v={{ app_version }}"></script>
<main class="report-workspace">{% block report_content %}{% endblock %}</main>
<script src="{% static 'js/reporting.js' %}?v={{ app_version }}" defer></script>
<script src="{% static 'js/report-overview.js' %}?v={{ app_version }}" defer></script>
<script src="{% static 'js/report-tooltip.js' %}?v={{ app_version }}" defer></script>
<script src="{% static 'js/report-analysis.js' %}?v={{ app_version }}" defer></script>
<script src="{% static 'js/report-interactions.js' %}?v={{ app_version }}" defer></script>
</body></html>
