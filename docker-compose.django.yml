services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.django
    env_file:
      - path: .env.django
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vision.json
    ports:
      - "${DJANGO_PORT:-19999}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_media:/app/media
      - ./secrets/google-vision.json:/run/secrets/google-vision.json:ro
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - path: .env.django
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmis} -d ${POSTGRES_DB:-dmis}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - django_db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  django_db:
  django_media:
