{% if section_form %}
<form method="post" action="{% url 'order_operations' order.pk %}" enctype="multipart/form-data" class="operations-form operations-section-form" data-workspace-save="operations">
<fieldset class="workspace-readonly" {% if not workspace_finance_editable %}disabled{% endif %}>
  {% csrf_token %}{{ section_form.financial_revision }}<input type="hidden" name="_section" value="{{ section_key }}">
  {% include fields_template with form=section_form %}
  <p class="autosave-status" data-autosave-status role="status" aria-live="polite">修改後會自動儲存</p>
</fieldset>
</form>
{% endif %}
