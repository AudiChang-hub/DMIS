{% extends "base.html" %}
{% block title %}系統暫時無法完成操作｜車輛銷售管理{% endblock %}
{% block content %}
<section class="card error-page" role="alert">
  <p class="eyebrow">操作未完成</p>
  <h1>系統暫時無法完成這個動作</h1>
  <p>這不是你的操作問題。系統已記錄錯誤，請返回上一頁確認資料後再試一次。</p>
  <p class="muted">若你正在建立訂單，已完成的自動草稿仍會保留，不需要重新填寫。</p>
  <div class="form-actions">
    <button class="button ghost" type="button" onclick="history.back()">返回上一頁</button>
    <a class="button primary" href="{% url 'dashboard' %}">回到待辦首頁</a>
  </div>
</section>
{% endblock %}
