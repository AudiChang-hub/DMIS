services:
  web:
    env_file:
      - path: .env.django
        required: true
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    logging: &production_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ocr-worker:
    env_file:
      - path: .env.django
        required: true
    logging: *production_logging

  search-worker:
    env_file:
      - path: .env.django
        required: true
    logging: *production_logging

  import-worker:
    env_file:
      - path: .env.django
        required: true
    mem_limit: 384m
    cpus: 0.50
    logging: *production_logging

  db:
    env_file:
      - path: .env.django
        required: true
    mem_limit: 1g
    cpus: 0.75
    pids_limit: 256
    logging: *production_logging

  redis:
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    logging: *production_logging

  tunnel-proxy:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deployment/nginx/tunnel-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default: {}
      legacy_tunnel:
        aliases:
          - odoo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8069/health/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 96m
    cpus: 0.10
    pids_limit: 64
    logging: *production_logging
    restart: unless-stopped

networks:
  legacy_tunnel:
    external: true
    name: dmis_default
