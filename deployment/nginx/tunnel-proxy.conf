# 訂單即時共編走 WebSocket（/ws/）：必須轉送 Upgrade／Connection，否則 Django 收到一般 GET 回 404。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 存取紀錄（T-59）：記總耗時與應用耗時供查慢；只記路徑、不記查詢字串（搜尋字可能含客戶資料）與來源 IP。
# 檔案在容器外（compose 掛載），容器啟動時由 40-dmis-access-log.sh 改名壓縮並保留 30 天。
# 真實來源 IP（登入節流用）：Cloudflare 邊緣一律覆寫 CF-Connecting-IP，用戶端無法偽造；
# 用戶端自帶的 X-Forwarded-For 會被 Cloudflare 保留在最左邊，daphne --proxy-headers 又取最左邊，
# 所以不能附加，要改成只送這一個值。本代理只綁 127.0.0.1 與 tunnel，沒有該標頭（本機健康檢查）時用連線位址。
map $http_cf_connecting_ip $dmis_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $uri $dmis_loggable {
    /health/ 0;
    default  1;
}
log_format dmis_timing escape=json '{"t":"$time_iso8601","m":"$request_method","p":"$uri","s":$status,'
    '"rt":$request_time,"urt":"$upstream_response_time","in":$request_length,"out":$bytes_sent,'
    '"rid":"$upstream_http_x_request_id","ws":"$http_upgrade"}';

server {
    listen 8069;
    server_name _;

    client_max_body_size 40m;
    access_log /var/log/nginx/access.log main;
    access_log /var/log/dmis/access.log dmis_timing if=$dmis_loggable;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # 連不到 Django（例如降級部署的那幾秒）時給可自動重新整理的說明頁，而不是 Cloudflare 的 502。
    error_page 502 = @unavailable;

    location / {
        # 藍綠部署：目前接流量的顏色由部署腳本寫進 dmis-upstream/active.conf，
        # 內容是 `set $dmis_backend web-green:8000;`，改完以 nginx -s reload 平順切換。
        set $dmis_backend web-blue:8000;
        include /etc/nginx/dmis-upstream/*.conf;
        proxy_pass http://$dmis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $dmis_client_ip;
        proxy_set_header X-Forwarded-For $dmis_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        # 後端停止時別讓請求卡著等，盡快回「系統更新中」。
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location @unavailable {
        default_type "text/html; charset=utf-8";
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><title>系統更新中</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,"Noto Sans TC",sans-serif;background:#f6f5f2;color:#1d1d1b}main{max-width:28rem;padding:2rem 1.5rem;text-align:center}h1{font-size:1.25rem;margin:0 0 .75rem}p{margin:0;line-height:1.7;color:#55524c}@media (prefers-color-scheme:dark){body{background:#151513;color:#f2f1ec}p{color:#b9b5ac}}</style></head><body><main><h1>系統更新中</h1><p>幾秒後會自動重新整理。<br>超過一分鐘仍是這個畫面，請通知管理員。</p></main></body></html>';
    }
}
