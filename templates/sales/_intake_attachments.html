{% if intake_attachments %}<section class="card"><h3>已保存的下訂附件</h3>{% if intake_mode %}<p>不需要的檔案可勾選移除，下一次暫存或送出時生效；新增附件暫存成功後，重新開啟草稿即可查看。</p>{% endif %}<ul>{% for attachment in intake_attachments %}<li>{{ attachment.get_kind_display }}：<a href="{% url 'order_intake_attachment' attachment.pk %}">{{ attachment.name }}</a>{% if intake_mode %} <label><input type="checkbox" name="_remove_intake_attachments" value="{{ attachment.pk }}">移除 {{ attachment.name }}</label>{% endif %}</li>{% endfor %}</ul></section>{% endif %}
