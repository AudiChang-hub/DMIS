{% comment %}訂單來源標記（services/order_origin.py）：圓點形狀與顏色同時區分——實心＝手動開單、空心＝Excel 匯入、半實心＝Excel 匯入已修改。detail 時在標記後列出最後修改人與時間。{% endcomment %}<span class="order-origin order-origin--{{ origin.key }}" title="{{ origin.detail }}" data-order-origin="{{ origin.key }}"{% if detail %} data-order-origin-detail{% endif %}><i class="order-origin__mark" aria-hidden="true"></i><b class="order-origin__label">{{ origin.label }}</b>{% if detail and origin.edited_at %}<span class="order-origin__meta">最後修改 {{ origin.edited_by }} · <time datetime="{{ origin.edited_at|date:'c' }}">{{ origin.edited_at|date:'Y/m/d H:i' }}</time></span>{% else %}<span class="visually-hidden">：{{ origin.detail }}</span>{% endif %}</span>
