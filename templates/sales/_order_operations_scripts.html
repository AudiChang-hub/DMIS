{% load static %}

<script src="{% static 'js/discount-preview.js' %}" defer></script>
<script>
(() => {
  const rows = document.getElementById("payment-records");
  const total = document.getElementById("id_payments-TOTAL_FORMS");
  function bind(row) {
    const button = row.querySelector("[data-delete-payment]");
    if (!button) return;
    button.addEventListener("click", () => { row.querySelector('[name$="-DELETE"]').checked = true; row.hidden = true; });
  }
  rows.querySelectorAll("[data-payment-row]").forEach(bind);
  document.getElementById("add-payment").addEventListener("click", () => {
    const i = Number(total.value), box = document.createElement("div");
    box.innerHTML = document.getElementById("payment-empty-row").innerHTML.replaceAll("__prefix__", i).trim();
    rows.appendChild(box.firstElementChild); total.value = i + 1; bind(rows.lastElementChild);
  });
  document.querySelectorAll(".secret-reveal").forEach(button => button.addEventListener("click", async () => {
    const body = new URLSearchParams({field: button.dataset.secret});
    const response = await fetch("{% url 'order_secret_reveal' order.pk %}", {method:"POST", headers:{"X-CSRFToken":"{{ csrf_token }}","Content-Type":"application/x-www-form-urlencoded"}, body});
    const data = await response.json(); alert(data.ok ? (data.value || "尚未設定") : data.error);
  }));
})();
</script>
