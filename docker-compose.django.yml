# 固定為正式環境既有專案名稱；也避免 Windows 中文資料夾無法推導名稱。
name: dmis-next

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.django
      args:
        DJANGO_UID: "${DJANGO_UID:-1000}"
        DJANGO_GID: "${DJANGO_GID:-1000}"
    env_file:
      - path: .env.django
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vision.json
    ports:
      - "${DJANGO_PORT:-19999}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'127.0.0.1','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - "${DJANGO_MEDIA_PATH:-django_media}:/app/media"
      - ./secrets/google-vision.json:/run/secrets/google-vision.json:ro
    restart: unless-stopped

  ocr-worker:
    build:
      context: .
      dockerfile: Dockerfile.django
      args:
        DJANGO_UID: "${DJANGO_UID:-1000}"
        DJANGO_GID: "${DJANGO_GID:-1000}"
    command: python manage.py rqworker ocr --worker-class rq.worker.SimpleWorker
    env_file:
      - path: .env.django
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vision.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "${DJANGO_MEDIA_PATH:-django_media}:/app/media"
      - ./secrets/google-vision.json:/run/secrets/google-vision.json:ro
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    restart: unless-stopped

  search-worker:
    build:
      context: .
      dockerfile: Dockerfile.django
      args:
        DJANGO_UID: "${DJANGO_UID:-1000}"
        DJANGO_GID: "${DJANGO_GID:-1000}"
    command: python manage.py rqworker search --worker-class rq.worker.SimpleWorker
    env_file:
      - path: .env.django
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 30s
    restart: unless-stopped

  import-worker:
    build:
      context: .
      dockerfile: Dockerfile.django
      args:
        DJANGO_UID: "${DJANGO_UID:-1000}"
        DJANGO_GID: "${DJANGO_GID:-1000}"
    command: python manage.py rqworker imports --worker-class rq.worker.SimpleWorker
    env_file:
      - path: .env.django
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.50
    stop_grace_period: 60s
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - path: .env.django
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmis} -d ${POSTGRES_DB:-dmis}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - django_db:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - django_redis:/data
    restart: unless-stopped

volumes:
  django_db:
  django_media:
  django_redis:
