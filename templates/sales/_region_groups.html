{% comment %}車行多選依區域分組（T-234）：regions＝dealer_regions.group_choices 的結果；item_tag="label" 用於報表中心勾選清單，其餘用於禮品名單。{% endcomment %}{% for region in regions %}<div class="region-group" data-region-group>
<div class="region-group__head"><button type="button" class="region-group__toggle" aria-expanded="true" data-region-toggle><strong>{{ region.label }}</strong><small data-region-count>{{ region.count }} 家</small></button><span class="region-group__actions"><button type="button" data-region-select="all">全選此區</button><button type="button" data-region-select="none">取消此區</button></span></div>
<div class="region-group__items" data-region-items>{% for value, label in region.choices %}{% if item_tag == "label" %}<label data-multi-option data-region-item><input type="checkbox" name="{{ input_name }}" value="{{ value }}" {% if value in selected %}checked{% endif %}><span>{{ label }}</span></label>{% else %}<div data-region-item><label><input type="checkbox" name="{{ input_name }}" value="{{ value }}">{{ label }}</label></div>{% endif %}{% endfor %}</div>
</div>{% endfor %}
