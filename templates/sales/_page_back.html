<nav class="page-context-nav" aria-label="頁面導覽">
  {% if cancel_edit %}
    <a class="back-link" href="{{ fallback_url }}" data-cancel-edit>
      <span aria-hidden="true">←</span>
      <span>{{ label }}</span>
    </a>
    <ol class="page-breadcrumbs" aria-label="目前位置"><li><a href="{{ fallback_url }}">訂單內容</a></li><li aria-current="page">編輯訂單</li></ol>
  {% else %}
    <a
      class="back-link"
      href="{{ fallback_url }}"{% if not direct_back %}
      data-smart-back
      data-fallback-url="{{ fallback_url }}"{% endif %}
    >
      <span aria-hidden="true">←</span>
      <span>{% if direct_back %}回到{{ label }}{% else %}回到上一畫面{% endif %}</span>
    </a>
    <ol class="page-breadcrumbs" aria-label="目前位置">
      {% if root_url and root_label %}
        <li><a href="{{ root_url }}">{{ root_label }}</a></li>
      {% endif %}
      <li><a href="{{ fallback_url }}">{{ parent_label|default:label|cut:"返回" }}</a></li>
      <li class="page-breadcrumb-current" aria-current="page" data-current-page-label{% if not current_label %} hidden{% endif %}>{{ current_label }}</li>
    </ol>
  {% endif %}
</nav>
