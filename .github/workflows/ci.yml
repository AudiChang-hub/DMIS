name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  django-quality:
    name: Django 品質檢查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: ci-isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ci -d finance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-django.txt

      - name: Install PDF font dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          test -r /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc

      - name: Install Django dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-django.txt
          python -m pip install --disable-pip-version-check pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-django.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify floating list viewport placement
        run: node --test tests/frontend/floating-list.test.cjs tests/frontend/bonus-periods.test.cjs tests/frontend/bonus-model-filter.test.cjs

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests with SQLite
        run: python manage.py test sales
      - name: Verify financial transactions with PostgreSQL
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_DB: finance_ci
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: ci-isolated-only
        run: python manage.py test sales.tests.test_financial_consistency sales.tests.test_order_commission_recipient sales.tests.test_channel_finance sales.tests.test_volume_bonus_conditions sales.tests.test_volume_bonus_multiple_periods sales.tests.test_bonus_model_filter sales.tests.test_bonus_rule_deletion --noinput

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Compose
        run: |
          sudo apt-get update && sudo apt-get install -y curl jq
          # docker and docker-compose should be available on runners

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo ".env created from .env.example"
          else
            echo ".env already present or .env.example missing"
          fi

      - name: Start services
        run: |
          docker compose up -d --build

      - name: Make smoke executable
        run: chmod +x scripts/smoke_odoo.sh || true

      - name: Wait for Odoo smoke
        run: ./scripts/smoke_odoo.sh

  pr-spec-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and enforce specs
        run: |
          BASE=origin/${{ github.event.pull_request.base.ref }}
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1 || true
          CHANGED=$(git diff --name-only $BASE...HEAD || true)
          echo "Changed files:\n$CHANGED"
          # If any of these critical files changed, require specs/ to also change
          echo "$CHANGED" | grep -E '^(addons/|docker-compose.yml|scripts/|Makefile)' && (
            echo "$CHANGED" | grep -q '^specs/' || (
              echo "Error: 修改 addons/**、docker-compose.yml、scripts/** 或 Makefile 時，必須同步更新 specs/**。" && exit 1
            )
          ) || echo "No critical changes or specs OK"
