{% extends 'base.html' %}
{% block title %}管理本單權限{% endblock %}
{% block content %}<section class="card"><p class="eyebrow">帳號與權限</p><h1>選擇要管理的人員</h1><p>{{ order.number }} · {{ order.owner_name }}</p><p class="muted">將前往統一的帳號權限工作區，不在訂單頁另外儲存設定。</p><form method="get"><label for="permission-account">人員</label><select class="form-control" id="permission-account" name="account" required><option value="">請選擇人員</option>{% for profile in accounts %}<option value="{{ profile.pk }}">{{ profile.user.get_full_name|default:profile.user.username }} (@{{ profile.user.username }}) · {{ profile.source.name|default:'馭盛內部' }}</option>{% endfor %}</select><p><button class="button primary">前往帳號與權限</button></p></form></section>{% endblock %}
